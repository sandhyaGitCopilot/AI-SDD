[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jira-testgen"
version = "0.1.0"
description = "Generate manual test cases from a Jira requirement, review them, and publish them back as linked issues."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pydantic>=2.7",
    "anthropic>=0.40",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
jira-testgen = "jira_testgen.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/jira_testgen"]

# --- T003: lint, format, types ---

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Spec Kit's own vendored scripts; not ours to restyle.
extend-exclude = [".specify"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",
    # N818 wants every exception named *Error. These classes are named for the condition
    # they report (IssueNotFound, AuthFailure) because they map one-to-one onto the exit
    # codes in contracts/cli.md, and reading them as conditions is what makes that mapping
    # legible. A uniform -Error suffix would add noise without adding information.
    "N818",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
files = ["src/jira_testgen"]
strict = true
warn_unreachable = true
plugins = []

[[tool.mypy.overrides]]
module = ["anthropic.*", "respx.*"]
ignore_missing_imports = true

# --- T004: tests ---

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra"
markers = [
    "contract: pins an external or user-facing contract",
    "integration: exercises a full command flow with mocked externals",
    "unit: exercises a single module",
]

[tool.coverage.run]
source = ["jira_testgen"]
branch = true

[tool.coverage.report]
show_missing = true
